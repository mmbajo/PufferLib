[base]
env_name = ragnarok
checkpoint_interval = 200

# One env per world: total_agents = worlds x num_agents. Each env waits on its world's map server
# (another process), so give every env its own thread: num_threads >= envs per buffer.
[vec]
total_agents = 1024
num_buffers = 2
num_threads = 16

[env]
num_agents = 64
lockstep = 1
episode_steps = 3000
# World steps (100 ms each) per decision.
action_repeat = 1
reward_scale = 1
reward_job = 0.5
reward_death = -1.0
# Share of episodes per task: 0 field leveling, 1 Swordman skills, 2 survival, 3 Mage skills,
# 4 Archer skills, 5 Acolyte skills, 6 Thief skills, 7 Merchant skills, 8 navigation.
task0_weight = 1
task1_weight = 0
task2_weight = 0
task3_weight = 0
task4_weight = 0
task5_weight = 0
task6_weight = 0
task7_weight = 0
task8_weight = 0

# The settings that pass G0 (the field policy beats the scripted bot and holds it through 400M
# steps, two seeds): learning_rate 0.015, ent_coef 0.0001, reward_scale 1, reward_death -1.
[train]
total_timesteps = 400_000_000
learning_rate = 0.015
ent_coef = 0.0001
horizon = 64
minibatch_size = 16384

# ./puffer sweep (a "sweep" line in slurm/train.sbatch's runs file) searches these and the rest of
# default.ini's [sweep.*] ranges for the highest final perf. A trial of 1.2e9 steps takes about
# 25 minutes on 16 worlds.
[sweep]
metric = perf
max_suggestion_cost = 2400
max_runs = 150

[sweep.train.total_timesteps]
distribution = log_normal
min = 2e8
max = 1.2e9
scale = time

# One env per world, so vec.total_agents must stay worlds x bots. default.ini's range cannot be
# removed and min = max would divide by zero, but every draw from [1024, 1025] rounds to 1024 (the job
# script sets the range to its own worlds x bots).
[sweep.vec.total_agents]
distribution = uniform_pow2
min = 1024
max = 1025
scale = auto

# At most horizon x total_agents: 32 x 1024 at the smallest horizon.
[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 4096
max = 32768
scale = auto

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 64
max = 1024
scale = auto

[sweep.env.action_repeat]
distribution = int_uniform
min = 1
max = 4
scale = auto
