[base]
env_name = ragnarok
checkpoint_interval = 200

# One env per world: total_agents = worlds x num_agents. Each env waits on its world's map server
# (another process), so give every env its own thread: num_threads >= envs per buffer.
[vec]
total_agents = 1024
num_buffers = 2
num_threads = 16

[env]
num_agents = 64
lockstep = 1
episode_steps = 3000
# World steps (100 ms each) per decision.
action_repeat = 1
reward_scale = 10
reward_job = 0.5
reward_death = -0.2
# Share of episodes per task (0 field leveling, 1 Swordman skills, 2 survival).
task0_weight = 1
task1_weight = 0
task2_weight = 0

[train]
total_timesteps = 400_000_000
learning_rate = 0.005
horizon = 64
minibatch_size = 16384
